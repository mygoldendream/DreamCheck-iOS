name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: DreamCheck-iOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project DreamCheck.xcodeproj \
            -scheme DreamCheck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/DreamCheck.app"
          if [ ! -d "$APP" ]; then
            APP=$(find build -name "DreamCheck.app" -type d | head -n 1)
          fi
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DreamCheck.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DreamCheck-ipa
          path: DreamCheck-iOS/DreamCheck.ipa
          if-no-files-found: error
